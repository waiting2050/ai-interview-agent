id: go-backend
name: Go 后端
version: "1.0"
rubric:
    dimensions:
        - key: correctness
          name: 正确性
          weight: 0.3
          anchor: 结论与机制是否正确
        - key: depth
          name: 深度
          weight: 0.25
          anchor: 是否讲到实现细节与异常分支
        - key: engineering_judgment
          name: 工程判断
          weight: 0.2
          anchor: 是否有取舍、成本与回滚意识
        - key: structure
          name: 表达结构
          weight: 0.15
          anchor: 是否结论先行、层次清晰
        - key: evidence_credibility
          name: 证据可信度
          weight: 0.1
          anchor: 是否有可核验的数据或经历支撑
directions:
    - id: go
      label: Go 语言与运行时
      keywords:
        - go
        - golang
        - 后端
        - 服务端
        - backend
    - id: mysql
      label: MySQL 与数据建模
      keywords:
        - mysql
        - mariadb
        - 数据库
        - dba
        - sql
    - id: redis
      label: Redis 与缓存
      keywords:
        - redis
        - 缓存
        - cache
topics:
    - id: go-concurrency
      direction: go
      topic: Go 并发模型
      objective: 说明 goroutine、channel 与 context 在真实服务中的配合方式
      difficulty: mid
      expected_points:
        - goroutine 调度与 G-M-P 模型
        - channel 阻塞与缓冲区设计
        - context 取消与超时传递
      focus: true
      source: curated
    - id: go-arch-layering
      direction: go
      topic: 服务分层与依赖边界
      objective: 说明这一层为什么存在、删掉会怎样，以及依赖方向如何守住
      difficulty: mid
      expected_points:
        - 分层职责与依赖方向
        - 领域层不依赖基础设施
        - 端口与适配器隔离
      source: curated
    - id: go-memory
      direction: go
      topic: 内存管理与 GC
      objective: 解释内存分配、GC 原理以及一次真实的 GC 问题排查
      difficulty: mid
      expected_points:
        - 逃逸分析
        - 三色标记与写屏障
        - GC 调优与内存泄漏排查
      source: curated
    - id: go-interface
      direction: go
      topic: 接口、反射与泛型
      objective: 说明接口动态派发和泛型约束的代价与适用场景
      difficulty: senior
      expected_points:
        - 接口动态派发与 itab
        - 类型断言与空接口陷阱
        - 泛型类型约束
      source: curated
    - id: go-error
      direction: go
      topic: 错误处理与稳定性
      objective: 说明错误链路、panic 边界以及超时重试下的幂等保障
      difficulty: mid
      expected_points:
        - 错误包装与 errors.Is/As
        - panic/recover 的边界
        - 超时、重试与幂等
      source: curated
    - id: go-arch-idempotency
      direction: go
      topic: 幂等与状态机设计
      objective: 说明接口重复调用与状态迁移如何保证只生效一次
      difficulty: mid
      expected_points:
        - 幂等键与去重存储
        - 状态机合法迁移
        - 重复请求与重试语义
      focus: true
      source: curated
    - id: go-network
      direction: go
      topic: 网络编程与连接治理
      objective: 说明 HTTP 超时链路、连接复用与优雅停机的实现
      difficulty: mid
      expected_points:
        - net/http 超时链路
        - 连接池与复用
        - 优雅停机
      source: curated
    - id: go-arch-lock
      direction: go
      topic: 并发与锁的工程取舍
      objective: 说明共享状态如何加锁、锁粒度如何取舍、失锁如何降级
      difficulty: mid
      expected_points:
        - 锁粒度与争用成本
        - 死锁预防与超时
        - 进程锁与分布式锁的边界
      source: curated
    - id: go-db
      direction: go
      topic: 数据库访问与事务
      objective: 说明连接池、事务边界以及一次慢查询定位
      difficulty: mid
      expected_points:
        - database/sql 连接池
        - 事务边界与回滚
        - SQL 慢查询定位
      source: curated
    - id: go-arch-observability
      direction: go
      topic: 可观测性设计取舍
      objective: 说明指标、日志与追踪为什么这样分层，删掉一类信号会怎样
      difficulty: mid
      expected_points:
        - 指标、日志与追踪的分工
        - 采样与成本控制
        - 从告警到定位的路径
      source: curated
    - id: go-observability
      direction: go
      topic: 可观测性与故障排查
      objective: 复述一次线上故障从发现到定位再到修复的完整过程
      difficulty: mid
      expected_points:
        - pprof 与 trace
        - 结构化日志与指标
        - 线上故障定位路径
      source: curated
    - id: go-arch-degradation
      direction: go
      topic: 降级与失败策略
      objective: 说明依赖失败时如何降级、哪些失败必须显式暴露
      difficulty: mid
      expected_points:
        - 超时、重试与熔断预算
        - 降级路径与数据一致性
        - 失败可观测与回滚
      source: curated
    - id: mysql-index
      direction: mysql
      topic: 索引与执行计划
      objective: 说明索引结构、回表代价以及如何读懂执行计划
      difficulty: mid
      expected_points:
        - B+ 树索引结构
        - 最左前缀与回表
        - 覆盖索引与执行计划判断
      focus: true
      source: curated
    - id: mysql-mvcc
      direction: mysql
      topic: 事务与 MVCC
      objective: 解释隔离级别下的可见性规则和一次并发场景验证
      difficulty: senior
      expected_points:
        - 隔离级别与可见性
        - Read View 与 undo log
        - 幻读与间隙锁
      focus: true
      source: curated
    - id: mysql-lock
      direction: mysql
      topic: 锁与死锁
      objective: 说明行锁、死锁产生条件以及线上死锁排查方式
      difficulty: mid
      expected_points:
        - 行锁与意向锁
        - 死锁检测与排查
        - 锁等待超时处理
      source: curated
    - id: mysql-slow
      direction: mysql
      topic: 慢查询优化
      objective: 给出一次从慢日志到索引调整的完整优化过程
      difficulty: mid
      expected_points:
        - 慢日志与 EXPLAIN
        - 统计信息与索引选择
        - 分页与排序优化
      source: curated
    - id: mysql-replica
      direction: mysql
      topic: 复制与高可用
      objective: 说明主从复制原理、延迟影响与切换时的数据一致性
      difficulty: senior
      expected_points:
        - 主从复制原理
        - 复制延迟与一致性读
        - 故障切换与数据校验
      source: curated
    - id: mysql-shard
      direction: mysql
      topic: 分库分表与数据迁移
      objective: 说明分片键选择、跨片查询限制以及不停机迁移方案
      difficulty: senior
      expected_points:
        - 分片键选择
        - 跨分片查询与事务
        - 双写迁移与校验
      source: curated
    - id: redis-structure
      direction: redis
      topic: 数据结构与内存编码
      objective: 说明常用类型的底层编码以及大 key 的治理方式
      difficulty: mid
      expected_points:
        - ziplist/listpack 编码转换
        - 跳表与有序集合
        - 大 key 与内存碎片
      source: curated
    - id: redis-persist
      direction: redis
      topic: 持久化与恢复
      objective: 对比 RDB 与 AOF，并说明恢复时间和数据安全的取舍
      difficulty: mid
      expected_points:
        - RDB 与 AOF 差异
        - fsync 策略与数据安全
        - 恢复时间与容量规划
      source: curated
    - id: redis-cache
      direction: redis
      topic: 缓存模式与一致性
      objective: 说明穿透、击穿、雪崩的处理以及缓存与数据库一致性
      difficulty: mid
      expected_points:
        - 缓存穿透、击穿、雪崩
        - 热 key 与大 key 治理
        - 缓存与数据库一致性
      focus: true
      source: curated
    - id: redis-lock
      direction: redis
      topic: 分布式锁
      objective: 说明锁的获取、续租、误删防护以及失效后的降级
      difficulty: mid
      expected_points:
        - SET NX PX 与唯一值
        - 续租与误删防护
        - 锁失效与降级方案
      focus: true
      source: curated
    - id: redis-ha
      direction: redis
      topic: 高可用与集群
      objective: 说明主从、哨兵、Cluster 的故障转移与一致性取舍
      difficulty: senior
      expected_points:
        - 主从与哨兵
        - Cluster 槽位与迁移
        - 脑裂与一致性取舍
      source: curated
    - id: redis-limit
      direction: redis
      topic: 限流与原子脚本
      objective: 说明如何用 Lua 实现原子限流以及集群下的限制
      difficulty: mid
      expected_points:
        - Lua 脚本原子性
        - 滑动窗口与令牌桶
        - 集群下脚本限制
      source: curated
lexicon:
    skills:
        - go
        - mysql
        - redis
        - grpc
        - kafka
        - 分布式事务
        - 高并发
    tools:
        - pprof
        - prometheus
        - grafana
        - git
        - docker
        - kubernetes
    keywords:
        - 后端
        - 服务端
        - backend
        - 高并发
        - 分布式
